[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "instmodel"
version = "1.3.1"
description = "Train TF/PyTorch models and export them to a JSON instruction format with NumPy inference"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joao Ferreira", email = "joaoprcf@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.20", "protobuf>=6.0"]
pytorch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/Joaoprcf/instmodel"

[tool.setuptools]
packages = ["instmodel", "instmodel.sequence"]
