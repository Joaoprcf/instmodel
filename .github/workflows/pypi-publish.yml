name: CI/CD Workflow

on:
  push:
    branches:
      - main
    tags:
      - "release-[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  test:
    name: Run ${{ matrix.backend }} tests in Docker
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [tf, torch]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t instmodel-test-${{ matrix.backend }} -f Dockerfile.${{ matrix.backend }} .
      - run: docker run --rm instmodel-test-${{ matrix.backend }}

  deploy:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/release-')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
